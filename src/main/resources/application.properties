spring.application.name=payflow

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/payflow_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Development fallback only. Set PAYFLOW_JWT_SECRET to a private Base64-encoded
# key of at least 32 bytes before deployment.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${PAYFLOW_JWT_EXPIRATION_MS:86400000}

server.error.include-message=always
